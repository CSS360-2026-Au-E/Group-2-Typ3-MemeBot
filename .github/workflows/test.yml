# Runs all the tests, including the smoke test, on every pull request
# into main and every push to main. A failing test fails the check.
# The tests use fakes for Discord and OpenAI, so no secrets are needed.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test
